<!DOCTYPE html>
<html lang="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Leik – Kontakt Leik-teamet.">
        <title>Kontakt</title>
        <link rel="stylesheet" href="css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
          <!----------------------- Meny -------------------------->

        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Leik</a></li>
                    <li><a href="favoritter.html">Favoritter</a></li>
                    <li><a href="om.html">Om oss</a></li>
                    <li><a href="kontakt.html" aria-current="page">Kontakt</a></li>
                </ul>
            </nav>
        </header>

        <main>  
                       <!---------- Kontaktskjema-------------->
            
             <div class="kontakt-boks">

                  <h1>Kontakt oss</h1>
                  <p>Har du spørsmål, tilbakemeldinger eller bare vil si hei? Vi hører gjerne fra deg! 🌿</p>

                 <form id="kontakt-form">

                  <div class="skjema-felt">
                     <label for="navn">Navn</label>
                     <input type="text" id="navn" name="navn">
                     <span class="feil" id="navn-feil"></span>
                   </div>

                   <div class="skjema-felt">
                     <label for="epost">E-post</label>
                     <input type="email" id="epost" name="epost">
                     <span class="feil" id="epost-feil"></span>
                   </div>

                   <div class="skjema-felt">
                     <label for="melding">Melding</label>
                     <textarea id="melding" name="melding"></textarea>
                     <span class="feil" id="melding-feil"></span>
                   </div>

                   <button type="submit" aria-label="Send kontaktskjema">Send</button>

                   <div id="takk-melding" hidden>
                     <p>Takk for meldingen! Vi svarer så snart vi kan. 😊</p>
                   </div>

                </form>
            
            </div>

        </main>

        <footer>
          <p>© 2025 Leik – skjermfri glede 🌿</p>
        </footer>
        
        <script src="js/main.js"></script>
        <script src="js/kontakt.js"></script>

    </body>
</html>
